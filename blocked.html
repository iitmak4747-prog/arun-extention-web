<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Site Blocked — Coder IITM</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <canvas id="matrix"></canvas>

  <div class="warning-box">
    <div class="skull">☠️</div>
    <h1 class="warn-title">SITE BLOCKED</h1>
    <p class="warn-msg">bhai sharam kar<br>khud block karke visit kar raha hai<br>jake padhai karle</p>

    <div class="arrow-row">
      <span class="arrow">↓</span>
      <span class="arrow">↓</span>
      <span class="arrow">↓</span>
    </div>

    <a class="motivate-link" href="https://youtube.com/shorts/QpQJ6boEOH8?si=gbaxu7QZQu8aXU7W" target="_blank">
      🔥 Watch This NOW
    </a>

    <div class="journal-box">
      <div class="journal-title">Why did you come here?</div>
      <div class="journal-chips">
        <button class="journal-chip" data-reason="Bored">Bored</button>
        <button class="journal-chip" data-reason="Stressed">Stressed</button>
        <button class="journal-chip" data-reason="Habit">Habit</button>
        <button class="journal-chip" data-reason="Avoiding work">Avoiding work</button>
      </div>
      <div class="journal-row">
        <input id="journalInput" class="journal-input" placeholder="or type your own…" maxlength="120" />
        <button id="journalSave" class="journal-save">Log</button>
      </div>
      <div id="journalDone" class="journal-done" style="display:none">Logged. Now go study.</div>
    </div>

    <button class="close-btn" onclick="window.close()">✕ Close This Tab</button>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
